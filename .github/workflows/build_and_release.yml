name: Build and Release Debian Package

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:

  build_and_release:
    name: Build and Release Debian Package
    # A DKMS source package is Architecture: all (DKMS builds the module on the target), so any
    # runner will do; resolute for its debhelper/dh-dkms.
    runs-on: ubuntu-24.04
    container: ubuntu:26.04
    permissions:
      contents: write
    steps:

      - name: Install build tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential debhelper devscripts fakeroot dpkg-dev git ca-certificates

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          DEBIAN_FRONTEND=noninteractive apt-get build-dep -y .
          apt-get clean

      - name: Build Debian package
        run: |
          debuild --no-lintian -us -uc -b
          cp -a ../cix-gpu-dkms_*.deb ./

      - name: Get version
        id: get_version
        run: |
          ver="$(dpkg-parsechangelog --show-field Version)"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          # git tags cannot contain ':', '+' or '~': sanitise them.
          echo "tag=$(echo "$ver" | tr ':+~' '---')" >> "$GITHUB_OUTPUT"

      - name: Get commit hash
        id: get_commit_hash
        uses: prompt/actions-commit-hash@v3

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          name: v${{ steps.get_version.outputs.tag }}-${{ steps.get_commit_hash.outputs.short }}
          tag_name: v${{ steps.get_version.outputs.tag }}-${{ steps.get_commit_hash.outputs.short }}
          generate_release_notes: true
          files: |
            ./*.deb
